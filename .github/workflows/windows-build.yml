name: Windows Build

on:
  push:
    branches: [main, fix/production-ready-transcription-app]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-application-without-offline-model
          path: |
            dist/
            dist-electron/
          retention-days: 14
